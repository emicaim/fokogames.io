<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FOKO Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root,[data-theme="light"]{--bg:#f7f6f2;--text:#1a1a18;--muted:#6b7280;--primary:#1a7a2e;--border:rgba(0,0,0,.08)}
    [data-theme="dark"]{--bg:#111110;--text:#e4e4e0;--muted:#9ca3af;--primary:#4caf63;--border:rgba(255,255,255,.08)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-font-smoothing:antialiased}
    body{
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:2rem;
    }
    .logo-wrap{display:flex;align-items:center;justify-content:center;gap:.75rem;margin-bottom:1.5rem}
    .logo-text{font-size:1.75rem;font-weight:700;letter-spacing:-.03em}
    .slogan{font-size:clamp(1.1rem,.8rem + 2vw,1.5rem);color:var(--muted);max-width:36ch;line-height:1.4}
    .theme-btn{
      position:fixed;top:1rem;right:1rem;
      background:none;border:1px solid var(--border);
      border-radius:.5rem;padding:.375rem .5rem;
      cursor:pointer;color:var(--muted);display:flex;align-items:center
    }
    footer{position:fixed;bottom:1rem;font-size:.75rem}
    footer a{color:var(--muted);text-decoration:none}
    footer a:hover{text-decoration:underline}
  </style>
</head>
<body>

<button class="theme-btn" data-tt aria-label="Cambiar tema">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<div class="logo-wrap">
  <svg width="40" height="40" viewBox="0 0 32 32" fill="none" aria-label="FOKO Games logo">
    <rect width="32" height="32" rx="8" fill="var(--primary)" opacity="0.15"/>
    <rect x="6" y="11" width="20" height="12" rx="4" stroke="var(--primary)" stroke-width="2" fill="none"/>
    <circle cx="20" cy="17" r="1.5" fill="var(--primary)"/>
    <circle cx="23" cy="14.5" r="1.5" fill="var(--primary)"/>
    <line x1="10" y1="17" x2="13" y2="17" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
    <line x1="11.5" y1="15.5" x2="11.5" y2="18.5" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <span class="logo-text">FOKO Games</span>
</div>

<p class="slogan">Juegos hechos con pasión por el fútbol</p>

<footer>
  <a href="delete-data.html">Eliminar mis datos</a>
</footer>

<script>
(function(){
  const t=document.querySelector('[data-tt]'),r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);
  const sun='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  const moon='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  if(t){t.innerHTML=d==='dark'?sun:moon;t.addEventListener('click',()=>{d=d==='dark'?'light':'dark';r.setAttribute('data-theme',d);t.innerHTML=d==='dark'?sun:moon;});}
})();
</script>
</body>
</html>
